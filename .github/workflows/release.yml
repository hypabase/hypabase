name: Release
on:
  push:
    tags: ["v*"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy hypabase/
      - run: uv run pytest -v --tb=short

  build-binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-13
            target: darwin-x86_64
          - os: ubuntu-latest
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.13
      - run: uv sync --extra dev
      - name: Build standalone binary
        run: |
          uv run pyinstaller \
            --onefile \
            --name hypabase-memory-${{ matrix.target }} \
            --collect-all sqlite_vec \
            --collect-all fastembed \
            --collect-all onnxruntime \
            --hidden-import hypabase.memory.server \
            --hidden-import hypabase.memory.agent \
            --hidden-import hypabase.memory.penman \
            --hidden-import hypabase.memory.resolution \
            --hidden-import hypabase.memory.strength \
            --hidden-import hypabase.memory.types \
            --hidden-import hypabase.engine.core \
            --hidden-import hypabase.engine.storage \
            --hidden-import hypabase.engine.embeddings \
            --hidden-import hypabase.engine.vector \
            --hidden-import hypabase.engine.persistence_engine \
            --hidden-import hypabase.client \
            --hidden-import hypabase.models \
            --hidden-import mcp.server \
            --hidden-import mcp.server.fastmcp \
            --hidden-import mcp.server.stdio \
            --hidden-import mcp.types \
            --hidden-import pydantic \
            --hidden-import pydantic.fields \
            --hidden-import pydantic.main \
            scripts/entry_memory.py
      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hypabase-memory-${{ matrix.target }}

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra docs
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy docs
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          uv run mike deploy "$VERSION" latest --update-aliases --push
